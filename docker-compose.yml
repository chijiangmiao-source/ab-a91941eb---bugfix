name: satcmd

services:
  app:
    build: .
    image: satcmd-app
    environment:
      PORT: 8080
      DATA_DIR: /data
    volumes:
      - app-data:/data
    ports:
      # Configurable host port: HOST_PORT=9000 docker compose up app
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    image: satcmd-app
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:8080
      HEALTH_TIMEOUT_MS: "60000"
    command: ["node", "verify/verify.js"]
    restart: "no"

volumes:
  app-data:
